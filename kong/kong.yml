_format_version: "3.0"
_transform: true

services:
  - name: nic-api
    url: http://host.docker.internal:8001
    routes:
      - name: nic-init-route
        paths:
          - /api/v1/init
        methods:
          - POST
        strip_path: false
      - name: nic-clients-route
        paths:
          - /api/v1/clients
        methods:
          - GET
        strip_path: false
  - name: nic-ui
    url: http://frontend:80
    routes:
      - name: nic-ui-route
        paths:
          - /
        strip_path: false
        preserve_host: true
